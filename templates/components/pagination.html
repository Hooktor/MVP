<nav class="pagination" aria-label="Pagination"><span>{{ page.paginator.count }} résultat{{ page.paginator.count|pluralize }} · Page {{ page.number }} sur {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button small" href="?{{ query }}&page={{ page.previous_page_number }}" hx-get="?{{ query }}&page={{ page.previous_page_number }}" hx-target="#results" hx-push-url="true">Précédent</a>{% endif %}{% if page.has_next %}<a class="button small" href="?{{ query }}&page={{ page.next_page_number }}" hx-get="?{{ query }}&page={{ page.next_page_number }}" hx-target="#results" hx-push-url="true">Suivant<i class="ti ti-chevron-right" aria-hidden="true"></i></a>{% endif %}</div></nav>
