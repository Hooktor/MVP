<ol class="timeline">{% for event in events %}<li><span class="timeline-dot"></span><strong>{{ event.description }}</strong><time>{{ event.created_at|date:"d M · H:i" }}</time><small>{{ event.actor.get_full_name|default:event.actor.username|default:"Traitement automatique" }}</small></li>{% empty %}<li class="timeline-empty">Aucun événement enregistré dans votre périmètre.</li>{% endfor %}</ol>
