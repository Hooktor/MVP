<label class="filter-select"><span>Filiale</span><select name="subsidiary"><option value="">Toutes les filiales</option>{% for x in subsidiaries %}<option value="{{ x.pk }}" {% if request.GET.subsidiary == x.pk|stringformat:"s" %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></label><label class="filter-select"><span>Domaine</span><select name="domain"><option value="">Tous les domaines</option>{% for x in domains %}<option value="{{ x.pk }}" {% if request.GET.domain == x.pk|stringformat:"s" %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></label>
