{% extends 'base.html' %}{% block content %}{% include 'components/page_header.html' with subtitle="Les pré-accords fournisseurs et leurs échéances, au même endroit." %}<form class="filterbar" method="get" hx-get="{% url 'solicitation_list' %}" hx-target="#results" hx-push-url="true" hx-trigger="submit, change from:select, input changed delay:350ms from:input" hx-sync="this:replace" hx-indicator="#list-loading"><label class="search-field"><i class="ti ti-search" aria-hidden="true"></i><input name="q" value="{{ request.GET.q }}" placeholder="Expert, référence, demande…" aria-label="Rechercher une sollicitation"></label><label class="filter-select"><span>Statut</span><select name="status"><option value="">Tous les statuts</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button class="button">Filtrer</button></form>{% include 'components/loader.html' %}<div class="panel flush" id="results">{% include 'partials/solicitations_table.html' %}</div>{% endblock %}
