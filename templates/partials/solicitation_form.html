<p class="eyebrow">NOUVEAU PRÉ-ACCORD</p><h2>Solliciter {{ expert.full_name }}</h2><p>Le fournisseur disposera de 48 heures pour confirmer la disponibilité de cet expert.</p>{% if eligible %}<form method="post" action="{% url 'solicitation_create' expert.pk %}" hx-post="{% url 'solicitation_create' expert.pk %}" hx-target="#modal-body" hx-disabled-elt="find button">{% csrf_token %}<div class="field"><label for="request-choice">Demande à associer</label><select class="input" name="request_id" id="request-choice" required>{% for r in eligible %}<option value="{{ r.pk }}">{{ r.reference }} · {{ r.title }}</option>{% endfor %}</select></div><div class="form-actions"><button class="button primary">Envoyer la sollicitation<i class="ti ti-send" aria-hidden="true"></i></button></div></form>{% else %}<div class="alert">Vous n’avez aucune demande en attente de matching. Soumettez d’abord une demande.</div><a class="button primary" href="{% url 'request_create' %}">Créer une demande</a>{% endif %}
