<div class="section-header"><h2>Notifications</h2><span class="pill">{{ unread_count }} non lues</span></div>{% for n in items %}<a href="{% if n.url %}{% url 'notification_open' n.pk %}{% else %}{% url 'notifications' %}{% endif %}"><strong>{{ n.title }}</strong><small>{{ n.created_at|date:"d M · H:i" }}</small></a>{% empty %}<p class="muted">Aucune nouvelle notification.</p>{% endfor %}<a class="text-link" href="{% url 'notifications' %}">Toutes les notifications</a>
